server.port=8083
spring.application.name=restful
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/your_dev_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
springdoc.swagger-ui.enabled=true
encryption.password=${ENCRYPTION_PASSWORD}
jwt.publicKey=${JWT_PUBLIC_KEY}
jwt.privateKey=${JWT_PRIVATE_KEY}
jwt.expiration=${JWT_EXPIRATION:3600000}
batch.cron.expression=${BATCH_CRON_EXPRESSION:0/5 * * * * *}

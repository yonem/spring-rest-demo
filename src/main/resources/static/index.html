<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot API ヘルスチェック</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Spring Boot API ヘルスチェック</h1>
    <p>APIの稼働状況を確認します。</p>

    <div class="status-box">
        <h2>API 接続ステータス:</h2>
        <p id="health-status" class="loading">チェック中...</p>
    </div>

    <button id="check-button">再チェック</button>

    <div class="details">
        <h2>詳細情報:</h2>
        <pre id="response-details">レスポンス待ち...</pre>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

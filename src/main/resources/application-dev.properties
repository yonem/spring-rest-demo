#--spring.profiles.active=dev
spring.application.name=restful
spring.datasource.url=jdbc:postgresql://localhost:5432/your_dev_db
spring.datasource.username=your_user
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver
api.cors.allowed-origins=http://localhost:8083
springdoc.swagger-ui.enabled=true
system.mail.from=test@example.com
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=0
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual_immediate
#server.port=8443
#server.ssl.enabled=true
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=your_keystore_password
#server.ssl.key-alias=your_key_alias
#server.ssl.key-password=your_keystore_password
encryption.password=your_32character_secret_key_here
jwt.
jwt.
jwt.expiration=3600000
logging.level.jp.ne.yonem.restful.demo.mapper=DEBUG
# cron式は「秒 分 時 日 月 曜日」の順で指定する
# アスタリスク(*)は「全て」を意味し、カンマ(,)はリスト、ハイフン(-)は範囲、スラッシュ(/)は間隔を示す
# 例: 0 0 0 * * コマンド は毎日午前0時0分にコマンドを実行する
batch.cron.expression=0/5 * * * * *

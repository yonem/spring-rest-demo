version: '3.8'
services:
  db:
    image: postgres:17.5
    restart: always
    environment:
      POSTGRES_DB: your_dev_db         # 任意のデータベース名に変更
      POSTGRES_USER: your_user         # 任意のユーザー名に変更
      POSTGRES_PASSWORD: your_password # 任意のパスワードに変更
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
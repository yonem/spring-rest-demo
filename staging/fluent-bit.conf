[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    info

[INPUT]
    Name             tail
    Tag              docker.*
    Path             /var/lib/docker/containers/*/*.log
    DB               /var/log/flb_docker.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Parser           docker

[FILTER]
    Name             docker
    Match            docker.*
    Host_Regex       (.*?)$
    Container_ID     (.*?)$
    Container_Name   (.*?)$
    Use_Unix_Socket  On
    Docker_Socket    /var/run/docker.sock

[OUTPUT]
    Name             es
    Match            *
    # 接続情報 (docker-compose.ymlで定義したサービス名を使用)
    Host             elasticsearch-host
    Port             9200
    Index            java-app-%Y.%m.%d
    Type             _doc
    Suppress_Type_Name On
